[package]
name = "sval-mcp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only WITH AdditionRef-sval-app-store"
publish = false
description = "Connects a local MCP agent to Sval."

[lib]
name = "sval_mcp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
