[package]
name = "sval-folder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only WITH AdditionRef-sval-app-store"
publish = false
description = "Reads and writes Sval's shared folder for the browser, in a process of its own."

[lib]
name = "sval_folder"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
getrandom = "0.4"
# The SMB 2 and 3 client the iPhone app's connector uses
# (`mobile/sval-mobile/Cargo.toml`), on its `smol` reactor, which a blocking
# call drives from the helper's one thread. MIT.
smb2 = { version = "0.43.0", default-features = false, features = ["smol"] }
smol = "2.0.2"

# Dropbox's API over HTTPS (`remote/dropbox.rs`). MIT or Apache-2.0. On macOS
# and Linux it runs on rustls with ring and Mozilla's roots, so the helper
# links no system TLS library. On Windows it runs on SChannel, which needs no
# C compiler to build, where ring does.
[target."cfg(not(windows))".dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
