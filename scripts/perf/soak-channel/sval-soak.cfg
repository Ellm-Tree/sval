//
// The soak's control channel, loaded by autoconfig (autoconfig.js). It takes
// the place of Marionette, whose presence pages can read as
// navigator.webdriver (Navigator::Webdriver) and which sites answer with bot
// checks. It listens only when SVAL_SOAK_PORT and SVAL_SOAK_TOKEN are set, on
// the loopback interface, and runs only requests that carry the token.
//
// Protocol: one JSON object per line each way.
//   {"token", "id", "script", "timeout_ms"} runs `script` in the browser
//   window's scope, with arguments[0] as the callback that answers.
//   {"token", "id", "tab", "script", "timeout_ms"} runs it in the page of the
//   tab whose browserId is `tab`, through the SvalSoak window actor.
//   The answer is {"id", "value"} or {"id", "error"}.
(function () {
  const Cc = Components.classes;
  const Ci = Components.interfaces;
  const Cu = Components.utils;
  // Autoconfig's scope has neither by default.
  Cu.importGlobalProperties(["TextDecoder", "TextEncoder"]);
  const port = Number(Services.env.get("SVAL_SOAK_PORT"));
  const token = Services.env.get("SVAL_SOAK_TOKEN");
  if (!port || !token) {
    return;
  }
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("svalsoak", Services.io.newFileURI(dir));
  ChromeUtils.registerWindowActor("SvalSoak", {
    parent: { esModuleURI: "resource://svalsoak/SvalSoakParent.sys.mjs" },
    child: { esModuleURI: "resource://svalsoak/SvalSoakChild.sys.mjs" },
    allFrames: false,
  });

  const window = () => Services.wm.getMostRecentWindow("navigator:browser");

  function runChrome(script, timeoutMs) {
    return new Promise((resolve, reject) => {
      const win = window();
      if (!win) {
        reject(new Error("no browser window"));
        return;
      }
      const sandbox = Cu.Sandbox(
        Services.scriptSecurityManager.getSystemPrincipal(),
        { sandboxPrototype: win, wantXrays: false, sandboxName: "sval-soak" }
      );
      const timer = win.setTimeout(
        () => reject(new Error(`timed out after ${timeoutMs} ms`)),
        timeoutMs
      );
      try {
        const fn = Cu.evalInSandbox(`(function () {\n${script}\n})`, sandbox);
        fn(value => {
          win.clearTimeout(timer);
          resolve(value);
        });
      } catch (e) {
        win.clearTimeout(timer);
        reject(e);
      }
    });
  }

  function runContent(tab, script, timeoutMs) {
    const win = window();
    const browser = win?.gBrowser.browsers.find(b => b.browserId == tab);
    const global = browser?.browsingContext.currentWindowGlobal;
    if (!global) {
      return Promise.reject(new Error(`no page in tab ${tab}`));
    }
    return Promise.race([
      global.getActor("SvalSoak").sendQuery("run", { script }),
      new Promise((_, reject) =>
        win.setTimeout(
          () => reject(new Error(`timed out after ${timeoutMs} ms`)),
          timeoutMs
        )
      ),
    ]);
  }

  function serve(transport) {
    const input = transport.openInputStream(0, 0, 0);
    const output = transport.openOutputStream(
      Ci.nsITransport.OPEN_BLOCKING,
      0,
      0
    );
    const decoder = new TextDecoder();
    const encoder = new TextEncoder();
    let buffer = "";
    const bytesToString = bytes => {
      let text = "";
      for (const b of bytes) {
        text += String.fromCharCode(b);
      }
      return text;
    };
    const reply = answer => {
      const text = bytesToString(encoder.encode(JSON.stringify(answer) + "\n"));
      output.write(text, text.length);
    };
    const handle = line => {
      let request;
      try {
        request = JSON.parse(line);
      } catch (e) {
        return;
      }
      if (request.token !== token) {
        reply({ id: request.id, error: "bad token" });
        return;
      }
      const timeoutMs = request.timeout_ms || 30000;
      const run =
        request.tab == null
          ? runChrome(request.script, timeoutMs)
          : runContent(request.tab, request.script, timeoutMs);
      run.then(
        value => reply({ id: request.id, value }),
        e => reply({ id: request.id, error: String(e?.message || e) })
      );
    };
    const pump = Cc["@mozilla.org/network/input-stream-pump;1"].createInstance(
      Ci.nsIInputStreamPump
    );
    pump.init(input, 0, 0, false);
    pump.asyncRead({
      onStartRequest() {},
      onStopRequest() {
        output.close();
      },
      // Reads exactly the bytes the pump reports: reading on from a
      // non-blocking socket stream throws once it is empty.
      onDataAvailable(request, stream, offset, count) {
        try {
          const scriptable = Cc[
            "@mozilla.org/scriptableinputstream;1"
          ].createInstance(Ci.nsIScriptableInputStream);
          scriptable.init(stream);
          const raw = scriptable.readBytes(count);
          const bytes = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) {
            bytes[i] = raw.charCodeAt(i);
          }
          buffer += decoder.decode(bytes, { stream: true });
          let nl;
          while ((nl = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, nl);
            buffer = buffer.slice(nl + 1);
            handle(line);
          }
        } catch (e) {
          dump(`sval-soak channel: ${e}\n`);
        }
      },
    });
  }

  const server = Cc["@mozilla.org/network/server-socket;1"].createInstance(
    Ci.nsIServerSocket
  );
  server.init(port, true, -1);
  server.asyncListen({
    onSocketAccepted(_, transport) {
      serve(transport);
    },
    onStopListening() {},
  });
})();
