  "chrome/browser/components/sval/home/starfield-stars-only-1920x1080.svg",
  "website/public/favicon*",
  "website/public/apple-touch-icon*",
  "website/src/assets/art/bg/*",
  "website/src/assets/art/brand/*",
  "website/public/og/*",
  "website/public/screenshots/*",
  "website/screenshots/*",
]
