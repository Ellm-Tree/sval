version = 1

# Licensing for every file that does not state its own, in the REUSE
# specification's format (https://reuse.software/spec-3.3/). A file this does
# not name is Sval's own work and carries Sval's notice in its first lines.
# scripts/check-licenses.py enforces both, and scripts/lint.sh runs it.
#
# When paths overlap, the last annotation that matches a file wins.

# The website at sval.app, which no license covers. Later annotations give
# its art, its docs and its prose-check config their own licenses.
[[annotations]]
path = "website/**"
SPDX-FileCopyrightText = "2026 Ellm Tree, Inc."
SPDX-License-Identifier = "LicenseRef-sval-website"

# Sval's own files that cannot carry a comment, or whose readers would show one.
[[annotations]]
path = [
  "*.md",
  "**/*.md",
  "renovate.json",
  "chrome/.gitkeep",
  "chrome/browser/components/sval/test/browser/sval_agent_doc.pdf",
  "tools/sval-mcp/Cargo.lock",
  "tools/sval-folder/Cargo.lock",
  "engine/Cargo.lock",
  "chrome/toolkit/mozapps/update/updater/*.der",
]
SPDX-FileCopyrightText = "2026 Ellm Tree, Inc."
SPDX-License-Identifier = "AGPL-3.0-only WITH AdditionRef-sval-app-store"

# Files other browsers wrote from Sval's own test browsing, for the import
# tests. They are data in each browser's format and carry no comment.
[[annotations]]
path = "chrome/browser/components/sval/test/xpcshell/data/import/**"
SPDX-FileCopyrightText = "2026 Ellm Tree, Inc."
SPDX-License-Identifier = "AGPL-3.0-only WITH AdditionRef-sval-app-store"

# Sval's brand art. branding/sval/LICENSE lists the same paths and says what
# may be done with them.
