<html>
  <head>
    <meta charset="utf-8" />
    <title>sval javascript sandbox</title>
  </head>
  <body>
    <iframe
      id="sandboxed"
      sandbox="allow-scripts"
      srcdoc="<body><script>document.title = 'ran'</script></body>"
    ></iframe>
    <iframe
      id="data"
      src="data:text/html,<body><script>document.title = 'ran'</script></body>"
    ></iframe>
  </body>
</html>
