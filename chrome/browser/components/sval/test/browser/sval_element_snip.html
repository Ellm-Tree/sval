<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Element snip test page</title>
    <style>
      #box {
        width: 200px;
        height: 100px;
        margin: 20px 0;
        background: #ccc;
      }
      #backdrop,
      #dialog,
      #app,
      #notice {
        display: none;
        position: fixed;
      }
      #backdrop {
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
      }
      #dialog {
        top: 100px;
        left: 100px;
        width: 300px;
        height: 200px;
        background: #fff;
        z-index: 2;
      }
      #app {
        inset: 0;
        background: #def;
      }
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 300px;
        height: 40px;
        background: #bcd;
      }
      #notice {
        right: 20px;
        bottom: 80px;
        width: 120px;
        height: 40px;
        background: #fd8;
        z-index: 1;
      }
      html.modal #backdrop,
      html.modal #dialog,
      html.app #app,
      html.app #notice,
      html.app #dialog {
        display: block;
      }
      html.modal,
      html.modal body,
      html.lock,
      html.lock body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <p id="before">Before.</p>
      <div id="box">Box</div>
      <p id="after">After.</p>
    </div>
    <div id="backdrop"></div>
    <div id="dialog" role="dialog" aria-label="Offer">Dialog</div>
    <div id="app">
      <div id="toolbar">Toolbar</div>
      <p>The page's own content, in a layer that fills the viewport.</p>
    </div>
    <div id="notice">Notice</div>
    <input id="field" />
    <script>
      const flags = location.search.slice(1).split("&");
      document.documentElement.className = flags.join(" ");
      if (flags.includes("tight")) {
        for (const node of [...document.body.childNodes]) {
          if (node.nodeType == Node.TEXT_NODE && !node.data.trim()) {
            node.remove();
          }
        }
      }
    </script>
  </body>
</html>
