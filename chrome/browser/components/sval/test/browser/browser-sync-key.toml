# This device's sync key outside pairing. Set Up Sync Again and a join
# change the profile's stored key for good, so these run on a fresh
# profile of their own.
# The prefs after the first are every browser manifest's baseline, which
# browser.toml gives the reasons for.
[DEFAULT]
prefs = [
  "browser.sval.firstRun.enabled=false",
  "browser.sval.sync.background.enabled=false",
  "services.settings.clock_skew_seconds=0",
  "browser.crashReports.cleanupCheck.enabled=false",
  "browser.search.suggest.enabled=false",
  "security.dialog_enable_delay=0",
]
support-files = ["head.js", "sval_pairing_helpers.js", "sval_panel_startup_helpers.js"]

["browser_sval_sync_key.js"]
