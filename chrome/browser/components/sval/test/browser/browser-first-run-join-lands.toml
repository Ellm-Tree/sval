# A fresh profile, whose first window opens first run at startup, for
# first run's join path, the other device's offer already in the folder. Only a profile's first launch is a real first run, so each
# scenario runs in a browser of its own.
# The prefs after the first are every browser manifest's baseline, which
# browser.toml gives the reasons for.
[DEFAULT]
prefs = [
  "browser.sval.firstRun.enabled=true",
  "browser.sval.sync.background.enabled=false",
  "services.settings.clock_skew_seconds=0",
  "browser.crashReports.cleanupCheck.enabled=false",
  "browser.search.suggest.enabled=false",
  "security.dialog_enable_delay=0",
]
support-files = ["head.js", "sval_first_run_helpers.js", "sval_join_scenario_helpers.js"]

["browser_sval_first_run_join_lands.js"]
