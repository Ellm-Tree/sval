<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Key taker</title>
  </head>
  <body>
    <div id="taker" tabindex="0">Every key is this page's.</div>
    <p id="text">Some text to select.</p>
    <script>
      // A page that takes every key it is given, as a web app that binds the
      // browser's shortcuts would: each keydown it hears, by `code` and its
      // modifiers, with its default prevented.
      const heard = [];
      window.heard = heard;
      for (const type of ["keydown", "keypress"]) {
        window.addEventListener(
          type,
          event => {
            if (type === "keydown") {
              heard.push({
                code: event.code,
                key: event.key,
                ctrl: event.ctrlKey,
                alt: event.altKey,
                shift: event.shiftKey,
                meta: event.metaKey,
              });
            }
            event.preventDefault();
          },
          true
        );
      }
      document.getElementById("taker").focus();
    </script>
  </body>
</html>
