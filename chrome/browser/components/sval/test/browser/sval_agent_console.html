<!doctype html>
<html><head><meta charset="utf-8"><title>Console page</title></head>
<body>
  <h1>Console</h1>
  <script>
    const tag = location.search.slice(1) || "page";
    console.log("log from %s", tag, 7);
    console.warn(`warn from ${tag}`);
    console.error(`error from ${tag}`);
    Promise.reject(new Error(`rejected from ${tag}`));
    setTimeout(() => {
      throw new Error(`thrown from ${tag}`);
    }, 0);
    addEventListener("message", e => console.log(e.data));
  </script>
</body></html>
