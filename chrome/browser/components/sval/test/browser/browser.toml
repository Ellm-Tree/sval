# First run opens a window-modal dialog on a fresh profile, which every
# harness profile is; the file that tests it turns it on for itself. Search
# suggestions would reach the network from the home page's field as a test
# types into it, which the harness forbids. Firefox's crash-file cleanup runs
# five minutes into a session and records the day it ran
# (`CrashFileCleaner`), a pref change that would fail whichever file was
# running then. Sval runs no sync pass of its own (`_passOnItsOwn`), so the
# document moves only when a test acts; a task about those passes turns them
# on for itself. Allow and Pair stay disabled for the dialog delay; the tasks
# about that delay set it back for themselves. A device publishes nothing
# before its first time reading (decision 1714), and the harness reaches no
# Remote Settings server, so every profile starts with a reading of no
# difference. The harness drives the browser through Marionette, which draws
# the address bar's remote-control cue (`gRemoteControl`), a button no window
# of a person's has, so a test would measure a fuller row than theirs.
# Battery Saver would follow the test machine's own power source, which
# changes the frame rate, background timers and when hidden Workspaces
# sleep; the file that tests it sets the mode for itself.
[DEFAULT]
prefs = [
  "browser.sval.batterySaver.mode=never",
  "browser.chrome.disableRemoteControlCueForTests=true",
  "browser.sval.firstRun.enabled=false",
  "browser.sval.sync.background.enabled=false",
  "services.settings.clock_skew_seconds=0",
  "browser.crashReports.cleanupCheck.enabled=false",
  "browser.search.suggest.enabled=false",
  "security.dialog_enable_delay=0",
]
support-files = [
