# A first run whose code waits for a device that never offers it. Each first-run scenario runs in a browser of its own, on a fresh
# profile whose first window opens first run at startup, because only a
# profile's first launch is a real first run. The prefs after the first are
# every browser manifest's baseline, which browser.toml gives the reasons
# for.
[DEFAULT]
prefs = [
  "browser.sval.firstRun.enabled=true",
  "browser.sval.sync.background.enabled=false",
  "services.settings.clock_skew_seconds=0",
  "browser.crashReports.cleanupCheck.enabled=false",
  "browser.search.suggest.enabled=false",
  "security.dialog_enable_delay=0",
]
support-files = [
  "head.js",
  "sval_first_run_helpers.js",
  "sval_first_run_dialog_helpers.js",
]

["browser_sval_first_run_join_waiting.js"]
