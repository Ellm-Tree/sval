# A file that reaches the shared folder runs real helper processes and waits
# out their deadlines, and the pairing files also derive Argon2id keys. These
# costs grow with how busy the machine is, while the harness's 30 s per file
# does not, so with several files at once on a loaded machine these overran
# it. They get twice the time.

# First run is off for every suite, as every harness profile is a fresh one.
# A device publishes nothing before its first time reading (decision 1714),
# and the harness reaches no Remote Settings server, so every profile starts
# with a reading of no difference.
[DEFAULT]
firefox-appdir = "browser"
prefs = [
  "browser.sval.firstRun.enabled=false",
  "services.settings.clock_skew_seconds=0",
]

# The host is a shell script, which Windows cannot run as a native host.
["test_native_messaging_closed_host.js"]
skip-if = ["os == 'win'"]

["test_subprocess_kill_after_exit.js"]

