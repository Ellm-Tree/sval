# These prefs are every browser manifest's baseline, which
# test/browser/browser.toml gives the reasons for.
[DEFAULT]
prefs = [
  "browser.sval.firstRun.enabled=false",
  "browser.sval.sync.background.enabled=false",
  "services.settings.clock_skew_seconds=0",
  "browser.crashReports.cleanupCheck.enabled=false",
  "browser.search.suggest.enabled=false",
  "security.dialog_enable_delay=0",
]
support-files = [
  "head.js",
  "sval_shares_panel_helpers.js",
  "!/browser/components/sval/test/browser/head.js",
]

["browser_sval_shares_panel_folder_again.js"]

["browser_sval_shares_panel_indicator.js"]
