<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Pair an agent</title>
    <link
      rel="stylesheet"
      href="chrome://browser/content/sval/sval-dialog.css"
    />
    <script
      type="module"
      src="chrome://browser/content/sval/elements/sval-elements.mjs"
    ></script>
    <script src="chrome://browser/content/sval/sval-dialog-hold.js"></script>
    <script src="chrome://browser/content/sval/agent-pair.js"></script>
  </head>
  <body>
    <form>
      <sval-dialog
        class="sval-ap"
        icon="agent"
        role="alertdialog"
        aria-labelledby="sval-ap-question"
        tabindex="-1"
      >
        <h1 slot="title" class="sval-dialog-title" id="sval-ap-question"></h1>
        <p slot="body" class="sval-dialog-body" id="sval-ap-detail">
          It gets its own window and Workspace, and it can browse there while
          you watch.
        </p>
        <ul class="sval-dialog-list" id="sval-ap-facts" hidden="hidden"></ul>
        <div class="sval-dialog-well sval-ap-kind">
          <div class="sval-ap-request">
            <span id="sval-ap-request"></span>
            <span
              class="sval-dialog-iso-pill"
              aria-hidden="true"
              hidden="hidden"
              >Isolated</span
            >
          </div>
          <label class="sval-dialog-check sval-ap-override">
            <sval-checkbox></sval-checkbox>
            <span id="sval-ap-override"></span>
          </label>
        </div>
        <sval-button slot="actions" class="sval-ap-deny" data-button="cancel">
          Deny
        </sval-button>
        <!-- Pair starts disabled, so it is no form's default button before
           - `agent-pair.js` has put its handler on the form, and Enter cannot
           - submit the form then, which would unload the alert and so answer
           - it as a deny. -->
        <sval-button
          slot="actions"
          class="sval-ap-allow"
          data-button="ok"
          type="primary"
          submit="submit"
          disabled="disabled"
        >
          Pair
        </sval-button>
      </sval-dialog>
    </form>
  </body>
</html>
