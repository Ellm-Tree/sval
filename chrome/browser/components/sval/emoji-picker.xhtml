<!DOCTYPE html>

<!--
  Sval's emoji picker, shown in the browser window's modal dialog by
  `SvalEmojiPicker.sys.mjs`. The grid is built by `emoji-picker.js`: it is
  every emoji Unicode lists, which is not markup anyone should maintain.
-->

<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Emoji</title>
    <link
      rel="stylesheet"
      href="chrome://browser/content/sval/sval-dialog.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/sval/emoji-picker.css"
    />
    <script
      type="module"
      src="chrome://browser/content/sval/elements/sval-elements.mjs"
    ></script>
    <script src="chrome://browser/content/sval/emoji-picker.js"></script>
  </head>

  <body>
    <sval-dialog class="sval-emoji-picker" role="dialog" aria-label="Emoji">
      <input
        class="sval-dialog-input sval-emoji-search"
        type="search"
        placeholder="Search emoji"
        aria-label="Search emoji"
        autocomplete="off"
        autofocus="autofocus"
      />
      <div
        class="sval-emoji-tones sval-edge-above"
        role="radiogroup"
        aria-label="Skin tone"
      ></div>
      <!-- `tabindex`: the grid's one Tab stop is its current emoji, and
           without one Gecko makes the scrolling box a stop of its own. -->
      <div
        class="sval-emoji-grid"
        role="grid"
        aria-label="Emoji"
        tabindex="-1"
      ></div>
      <!-- Where the grid ends, the part across its bottom edge: its shadow
           falls over the rows past that edge (`SvalDom.shadeScrollEdges`). -->
      <div class="sval-emoji-foot sval-edge-below" aria-hidden="true"></div>
      <div class="sval-emoji-empty" role="status" hidden="hidden">
        No emoji match.
      </div>
      <sval-button slot="actions" class="sval-emoji-none" data-button="none">
        No emoji
      </sval-button>
      <sval-button
        slot="actions"
        class="sval-emoji-cancel"
        data-button="cancel"
      >
        Cancel
      </sval-button>
    </sval-dialog>
  </body>
</html>
