<!DOCTYPE html>

<!--
  Sval's general dialog, opened by `SvalDialog.sys.mjs`. `sval-dialog.js` fills
  it from what the opener passes in.
-->

<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <link
      rel="stylesheet"
      href="chrome://browser/content/sval/sval-dialog.css"
    />
    <script
      type="module"
      src="chrome://browser/content/sval/elements/sval-elements.mjs"
    ></script>
    <script src="chrome://browser/content/sval/sval-dialog.js"></script>
  </head>
  <body>
    <form>
      <sval-dialog
        role="dialog"
        aria-labelledby="sval-dialog-title"
        aria-describedby="sval-dialog-body"
      >
        <h1 slot="title" class="sval-dialog-title" id="sval-dialog-title"></h1>
        <p
          slot="body"
          class="sval-dialog-body"
          id="sval-dialog-body"
          hidden="hidden"
        ></p>
        <p
          slot="warning"
          class="sval-dialog-warning"
          id="sval-dialog-warning"
          hidden="hidden"
        ></p>
        <div class="sval-dialog-field" hidden="hidden">
          <label class="sval-dialog-label" for="sval-dialog-input"></label>
          <sval-field
            class="sval-dialog-input"
            id="sval-dialog-input"
            autocomplete="off"
          ></sval-field>
        </div>
        <dl class="sval-dialog-details" hidden="hidden"></dl>
        <label class="sval-dialog-check" hidden="hidden">
          <sval-checkbox></sval-checkbox>
          <span class="sval-dialog-check-label"></span>
        </label>
      </sval-dialog>
    </form>
  </body>
</html>
