<!--
  The bookmarks a new sval profile starts with: none. Firefox's set is a
  "Mozilla Firefox" folder of mozilla.org links carrying Firefox's logo; Sval's
  bookmarks are the user's own. jar.mn overrides Firefox's file with this one.
-->
<!DOCTYPE NETSCAPE-Bookmark-file-1>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none';" />
    <title>Bookmarks</title>
  </head>
  <body>
    <h1>Bookmarks</h1>
    <dl><p></p></dl>
  </body>
</html>
