[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition = "2024"
publish = false

# Generates the engine's Swift and Kotlin bindings from its compiled library
# (`mobile/ios/build-engine.sh`). Its `uniffi` must match the engine's, or the
# bindings disagree with the library's checksums and fail at load.
[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
