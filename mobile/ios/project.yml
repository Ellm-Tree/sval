# XcodeGen's description of the iOS app. `xcodegen generate` in this
# directory writes Sval.xcodeproj, which is not committed.
name: Sval
options:
  bundleIdPrefix: app.sval
  preGenCommand: ./make-icons.sh
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: WN6TRJ4H8P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # The engine is built for Apple silicon simulators only
    # (`build-engine.sh`).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Sval:
    type: application
    platform: iOS
    sources:
      - path: Sval
      - path: Generated/swift
      - path: Generated/Icons.xcassets
      # The home screen icon, which make-icons.sh writes.
      - path: Generated/AppIcon.icon
      # Outfit, the brand typeface, as the desktop's home page ships it.
      - path: ../../chrome/browser/components/sval/home/Outfit.ttf
        buildPhase: resources
      # The desktop's colour maths, which draws a custom colour
      # (`DesktopColor.swift`).
      - path: ../../chrome/browser/components/sval/SvalColor.sys.mjs
        buildPhase: resources
      # What Settings › Licenses lists, which scripts/generate-app-license.py
      # --ios writes.
      - path: Licenses.json
        buildPhase: resources
      # The desktop's rules for which app an agent is (`AgentBrands.swift`).
      - path: ../../chrome/browser/components/sval/SvalAgentBrands.sys.mjs
        buildPhase: resources
    dependencies:
      - framework: Generated/SvalEngine.xcframework
        embed: false
    # Keys the build settings can't set. XcodeGen writes this file from here.
    info:
      path: Generated/Info.plist
      properties:
        # A page playing in the tab in front keeps playing in the background
        # (`BackgroundAudio.swift`).
        UIBackgroundModes: [audio]
        UIAppFonts: [Outfit.ttf, JetBrainsMono.ttf]
        # The bar's fold follows the finger at the screen's full rate.
        CADisableMinimumFrameDurationOnPhone: true
        # Web links, which Sval opens as the default browser
        # (`com.apple.developer.web-browser`; `openIncoming`).
        CFBundleURLTypes:
          - CFBundleURLName: app.sval.ios.web
            CFBundleURLSchemes: [http, https]
        # Apple: NO when an app's encryption is "exempt from export
        # compliance documentation requirements" ("Complying with encryption
        # export regulations"). App Store Connect's questions put the sync's
        # standard encryption there while the app isn't sold in France, and
        # without the key every upload waits on them.
        ITSAppUsesNonExemptEncryption: false
        # App Transport Security refuses plain HTTP, and a browser opens the
        # sites that still serve it. The exception covers the web views
        # alone, so the app's own connections (the shared folder, the
        # blocking lists, site icons) keep App Transport Security.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # A row dragged in the Workspace tree (`TreeDrop.swift`).
        # iPad multitasking needs every orientation, and App Store Connect
        # refuses an iPad build without them.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Downloads go to Documents/Downloads (`Downloads.swift`), which the
        # Files app shows under On My iPhone › Sval with these two.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.sval.ios.node
            UTTypeDescription: Sval Workspace row
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sval.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sval's blue, which every system control takes.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sval
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Sval connects to the server on your network that holds your shared folder.
        # iOS ends the app when it asks for a protected resource whose
        # purpose string is missing. A page reaches each of these through
        # WebKit: a file input's Take Photo or Video, getUserMedia, the
        # Geolocation API, and the image menu's Add to Photos.
        INFOPLIST_KEY_NSCameraUsageDescription: Sval uses your camera when a website asks to take a photo or start a video call.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Sval uses your microphone when a website asks to record audio or start a call.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Sval shares your location with a website you allow.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Sval saves the images you choose to your photo library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  # Walks the app's screens in the simulator with the demo tree
  # (`Demo.swift`), saving a screenshot at each step to the folder in
  # SVAL_SHOTS, so a change can be looked at without a device.
  SvalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SvalUITests
    dependencies:
      - target: Sval
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sval.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sval
  # Checks the colour maths and what each surface draws from it, in the
  # app's own process, so a colour every screen gets wrong fails here.
  SvalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SvalTests
    dependencies:
      - target: Sval
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sval.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sval:
    build:
      targets:
        Sval: all
    test:
      targets:
        - SvalTests
        - SvalUITests
      # Reaches the unit tests' host app, which shows an empty scene
      # (`SvalApp`). A UI test's app takes only the arguments its
      # `XCUIApplication` gives it.
      commandLineArguments:
        "-svalUnitTestHost": true
