# ", and" ends a list or joins two clauses. A bare "and" also sits inside
# UI names like Privacy and Security, so only the comma form counts.
extends: occurrence
message: "Two ', and' joins in one sentence. Split the sentence."
level: error
scope: sentence
max: 1
token: ', and\b'
