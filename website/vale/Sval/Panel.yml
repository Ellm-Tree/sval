# "Panel" passes after "Workspace" or "Workspaces", and in Firefox's
# Privacy and Security panel.
extends: existence
message: "Say Workspace where things live, and 'Workspace panel' for the sidebar itself."
level: error
nonword: true
tokens:
  - '(?i)(?<!workspace )(?<!workspaces )(?<!security )\bpanels?\b'
