# nonword: Vale's word boundary after "?" never matches before a space.
extends: existence
message: "'%s' sets up a reveal. Say the thing itself."
level: error
ignorecase: true
nonword: true
tokens:
  - "\\bhere's the (?:thing|catch|kicker|best part)\\b"
  - '\bthe (?:result|catch|kicker|best part|twist|upshot)\?'
  - '\bthe (?:best part|kicker|bottom line) is\b'
